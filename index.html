<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Discover FashionHub's latest fashion collection.">
  <title>FashionHub — New season</title>
  <style>
    body {
      margin: 0;
      background: #f7f5f0;
      color: #25231f;
      font-family: Arial, Helvetica, sans-serif;
    }

    header,
    main,
    footer {
      padding: 1.5rem clamp(1.25rem, 7vw, 6rem);
    }

    header,
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    header {
      background: #fff;
    }

    .brand {
      color: inherit;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-decoration: none;
    }

    main {
      display: grid;
      min-height: 65vh;
      align-content: center;
      justify-items: start;
      background: #e8e1d7;
    }

    .eyebrow {
      color: #8d503d;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0.5rem 0 1rem;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3rem, 10vw, 7rem);
      font-weight: 400;
      letter-spacing: -0.06em;
    }

    p {
      max-width: 34rem;
      line-height: 1.7;
    }

    .link {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.9rem 1.2rem;
      background: #25231f;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-decoration: none;
      text-transform: uppercase;
    }

    footer {
      background: #25231f;
      color: #fff;
      font-size: 0.8rem;
    }

    @media (max-width: 480px) {
      header,
      footer {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="./">FASHIONHUB</a>
    <span>New season, new perspective</span>
  </header>
  <main>
    <p class="eyebrow">The latest edit</p>
    <h1>Wear your<br>own story.</h1>
    <p>Discover expressive pieces and effortless essentials, chosen to make everyday style feel personal.</p>
    <a class="link" href="lookbook/index.html">Explore the lookbook</a>
  </main>
  <footer>
    <a class="brand" href="./">FASHIONHUB</a>
    <span>&copy; 2026 FashionHub</span>
  </footer>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Find outfit inspiration in the FashionHub lookbook.">
  <title>Lookbook — FashionHub</title>
  <style>
    body {
      margin: 0;
      background: #f7f5f0;
      color: #25231f;
      font-family: Arial, Helvetica, sans-serif;
    }

    header,
    main,
    footer {
      padding: 1.5rem clamp(1.25rem, 7vw, 6rem);
    }

    header,
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    header {
      background: #fff;
    }

    .brand {
      color: inherit;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-decoration: none;
    }

    main {
      min-height: 60vh;
      padding-top: 5rem;
      background: #e8e1d7;
    }

    .eyebrow {
      color: #8d503d;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0.5rem 0 1rem;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3rem, 9vw, 6rem);
      font-weight: 400;
      letter-spacing: -0.06em;
    }

    p {
      max-width: 34rem;
      line-height: 1.7;
    }

    .back-link {
      display: inline-block;
      margin-top: 1rem;
      color: #25231f;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    footer {
      background: #25231f;
      color: #fff;
      font-size: 0.8rem;
    }

    @media (max-width: 480px) {
      header,
      footer {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="../">FASHIONHUB</a>
    <span>Inspiration for the season</span>
  </header>
  <main>
    <p class="eyebrow">The FashionHub lookbook</p>
    <h1>Everyday, styled.</h1>
    <p>Explore outfit ideas, fresh color pairings, and effortless layers to inspire your own personal style.</p>
    <a class="back-link" href="../">Back to home</a>
  </main>
  <footer>
    <a class="brand" href="../">FASHIONHUB</a>
    <span>&copy; 2026 FashionHub</span>
  </footer>
</body>
</html>
